<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1628"/>
      <stop offset="1" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0D47A1"/>
      <stop offset="1" stop-color="#64B5F6"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="72" height="26" width="0"><animate attributeName="width" from="0" to="200" begin="0.4s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="196" height="26" width="0"><animate attributeName="width" from="0" to="240" begin="2.6s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="290" height="26" width="0"><animate attributeName="width" from="0" to="160" begin="4.4s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="spec"><rect x="640" y="70" width="230" height="300" rx="6"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .p { fill: #42A5F5; font-size: 15px; }
    .cmd { fill: #E3F2FD; font-size: 15px; }
    .out { fill: #90CAF9; font-size: 15px; }
    .dim { fill: #5C7A99; font-size: 13px; }
    .name { fill: #FFFFFF; font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
    .proj { fill: #BBDEFB; font-size: 14px; }
  </style>

  <!-- window -->
  <rect x="10" y="10" width="880" height="380" rx="14" fill="url(#bg)" stroke="#1565C0" stroke-opacity="0.45"/>
  <rect x="10" y="10" width="880" height="38" rx="14" fill="#0F2540"/>
  <rect x="10" y="34" width="880" height="14" fill="#0F2540"/>
  <circle cx="36" cy="29" r="6" fill="#FF5F57"/>
  <circle cx="56" cy="29" r="6" fill="#FEBC2E"/>
  <circle cx="76" cy="29" r="6" fill="#28C840"/>
  <text x="450" y="34" text-anchor="middle" class="mono dim">luchitha@kegalle: ~</text>

  <!-- line 1 -->
  <g clip-path="url(#c1)">
    <text x="40" y="90" class="mono"><tspan class="p">~ $</tspan><tspan class="cmd" dx="9">whoami</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.5s" fill="freeze"/>
    <text x="40" y="142" class="mono name">Luchitha Jayawardena</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <text x="40" y="172" class="mono out">4th yr CS @ SLIIT · backend · distributed systems · local AI</text>
  </g>

  <!-- line 2 -->
  <g clip-path="url(#c2)">
    <text x="40" y="214" class="mono"><tspan class="p">~ $</tspan><tspan class="cmd" dx="9">ls ~/shipped</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.5s" fill="freeze"/>
    <text x="40" y="242" class="mono proj" xml:space="preserve">fivehour/     utter/        signalqa/     butterfly-effect/</text>
    <text x="40" y="266" class="mono proj" xml:space="preserve">wiber/        testlang++/   labyrinth/    meridian/     ...</text>
  </g>

  <!-- line 3 -->
  <g clip-path="url(#c3)">
    <text x="40" y="308" class="mono"><tspan class="p">~ $</tspan><tspan class="cmd" dx="9">uptime</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.1s" dur="0.5s" fill="freeze"/>
    <text x="40" y="334" class="mono out">up 4 yrs  ·  load avg: lectures, day job, side projects</text>
  </g>

  <!-- final prompt + cursor -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.7s" dur="0.2s" fill="freeze"/>
    <text x="40" y="364" class="mono p">~ $</text>
    <rect x="76" y="351" width="9" height="17" fill="#42A5F5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="5.7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- spectrum panel: a nod to the FFT and voice projects -->
  <g clip-path="url(#spec)">
    <rect x="640" y="70" width="230" height="300" rx="6" fill="#0A1A30" stroke="#1565C0" stroke-opacity="0.35"/>
    <text x="656" y="94" class="mono dim">fft --live</text>
    <g fill="url(#bar)">
      <rect x="658" y="250" width="10" height="100"><animate attributeName="height" values="100;40;140;70;100" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="250;310;210;280;250" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="674" y="230" width="10" height="120"><animate attributeName="height" values="120;180;60;150;120" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="230;170;290;200;230" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="690" y="200" width="10" height="150"><animate attributeName="height" values="150;90;200;110;150" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="200;260;150;240;200" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="706" y="160" width="10" height="190"><animate attributeName="height" values="190;120;220;160;190" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="160;230;130;190;160" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="722" y="190" width="10" height="160"><animate attributeName="height" values="160;210;100;180;160" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="190;140;250;170;190" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="738" y="220" width="10" height="130"><animate attributeName="height" values="130;70;170;90;130" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="220;280;180;260;220" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="754" y="250" width="10" height="100"><animate attributeName="height" values="100;150;50;120;100" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="250;200;300;230;250" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="770" y="270" width="10" height="80"><animate attributeName="height" values="80;40;120;60;80" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="270;310;230;290;270" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="786" y="285" width="10" height="65"><animate attributeName="height" values="65;100;30;80;65" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="285;250;320;270;285" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="802" y="300" width="10" height="50"><animate attributeName="height" values="50;25;80;40;50" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="300;325;270;310;300" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="818" y="310" width="10" height="40"><animate attributeName="height" values="40;60;20;50;40" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="310;290;330;300;310" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="834" y="318" width="10" height="32"><animate attributeName="height" values="32;15;45;25;32" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="318;335;305;325;318" dur="1.5s" repeatCount="indefinite"/></rect>
    </g>
    <line x1="652" y1="350" x2="858" y2="350" stroke="#1565C0" stroke-opacity="0.6"/>
  </g>
</svg>
